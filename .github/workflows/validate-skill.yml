name: Validate skill

on:
  pull_request:
  push:
    branches:
      - main
      - feature/cross-platform-dotnet-performance-skill

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate package structure and links
        run: python3 scripts/validate-skill.py
